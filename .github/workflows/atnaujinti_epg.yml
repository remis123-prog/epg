name: Kasdienis EPG Atnaujinimas

on:
  schedule:
    # Skriptas automatiškai pasileis kasdien 04:00 val. UTC laiku (apie 07:00 val. Lietuvos laiku)
    - cron: '0 4 * * *'
  workflow_dispatch: # Ši eilutė leis paleisti skriptą rankiniu būdu bet kada

permissions:
  contents: write

jobs:
  download-and-save:
    runs-on: ubuntu-latest
    steps:
      - name: Atsisiunčiam talpyklos failus
        uses: actions/checkout@v4

      - name: Atsisiunčiam EPG iš blokuojamo serverio
        run: |
          curl -L -o epg.xml.gz "http://epg.streaming-elbrus.su/xmltv/epg.xml.gz"

      - name: Išsaugom ir įkeliam naują failą į GitHub
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add epg.xml.gz
          # Tikrinam, ar failas pasikeitė, kad nedarytume tuščių atnaujinimų
          git diff-index --quiet HEAD || git commit -m "Automatinis EPG atnaujinimas"
          git push
